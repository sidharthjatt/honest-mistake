<!DOCTYPE html><html><head><meta charset="utf-8"><title>JS/Python scorer parity</title>
<style>body{font-family:ui-monospace,Menlo,monospace;background:#14141a;color:#e8e6ee;padding:1rem}
pre{white-space:pre-wrap;word-break:break-word;font-size:.75rem}</style></head><body>
<pre id="out">running…</pre>
<script type="module">
import { AnswerKey, score } from '../docs/agent/scoring.js';

const out = document.getElementById('out');
const log = [];
const say = s => { log.push(s); out.textContent = log.join('\n'); };

async function j(p) {
  const r = await fetch(p, { cache: 'no-cache' });
  if (!r.ok) throw new Error(p + ' -> ' + r.status);
  return r.json();
}

/* Value equality, and separately key order. Key order is not required for
   this port the way it was for the tools — nothing here is serialised back
   to a model — but a drift in it usually means a field was added in the
   wrong place, so it is reported rather than ignored. */
function deepEqual(a, b) {
  if (a === b) return true;
  if (a === null || b === null || typeof a !== typeof b) return false;
  if (typeof a !== 'object') return Object.is(a, b);
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) return a.length === b.length && a.every((v, i) => deepEqual(v, b[i]));
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => kb.includes(k) && deepEqual(a[k], b[k]));
}
function keyOrder(v) {
  if (Array.isArray(v)) return v.map(keyOrder);
  if (v && typeof v === 'object') return Object.keys(v).map(k => [k, keyOrder(v[k])]);
  return null;
}
/* Where exactly two results differ, to the leaf. */
function* diffs(a, b, path = '') {
  if (deepEqual(a, b)) return;
  const obj = a && b && typeof a === 'object' && typeof b === 'object';
  if (!obj || Array.isArray(a) !== Array.isArray(b)) { yield [path, a, b]; return; }
  const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])];
  for (const k of keys) {
    const p = Array.isArray(a) ? `${path}[${k}]` : `${path}.${k}`;
    if (!(k in a) || !(k in b)) { yield [p, a[k] ?? '<absent>', b[k] ?? '<absent>']; continue; }
    yield* diffs(a[k], b[k], p);
  }
}

try {
  const [bundle, scoring, layer1, canary] = await Promise.all([
    j('./scoring_cases.json'),
    j('../docs/data/scoring.json'),
    j('../docs/data/tools/layer1/shap_global.json'),
    j('../docs/data/tools/canary/shap_global.json'),
  ]);
  const key = new AnswerKey(scoring);
  /* The same feature lists the generator read, so a reachability
     mismatch is the port's and not a difference in the inputs. */
  const features = {
    layer1: layer1.map(r => r.feature),
    canary: canary.map(r => r.feature),
  };

  let valueBad = 0, orderBad = 0;
  const firstFew = [];

  for (const c of bundle.cases) {
    const got = score(c.flags, key, c.canary_present,
                      c.variant ? features[c.variant] : null);
    const okValue = deepEqual(got, c.result);
    const okOrder = JSON.stringify(keyOrder(got)) === JSON.stringify(keyOrder(c.result));
    if (!okValue) valueBad += 1;
    if (!okOrder) orderBad += 1;
    if (!okValue && firstFew.length < 6) {
      firstFew.push([c, [...diffs(c.result, got)].slice(0, 8)]);
    }
  }

  say(`cases:              ${bundle.cases.length}`);
  say(`  synthetic:        ${bundle.synthetic_count}`);
  say(`  recorded runs:    ${bundle.recorded_count}`);
  say(`value mismatches:   ${valueBad}`);
  say(`key-order mismatch: ${orderBad}`);
  say('');

  /* The bundle generator already checked Python-now against the published
     bundle. Re-stating it here means a reader of this page sees all three
     legs of the comparison without opening the JSON. */
  say(`recorded cases reproducing the published bundle: ` +
      `${bundle.stale_against_published.length === 0 ? 'all' :
         'NOT ALL — ' + bundle.stale_against_published.join(', ')}`);
  say('');

  if (!valueBad) {
    say('No divergence on any case.');
    /* One property worth asserting directly rather than inferring from a
       case list: an honest run must never report a missed canary. It is
       the thing the scorer change existed to fix. */
    const honest = score(['all_util', 'il_util'], key, false, features.layer1);
    const ok = honest.canary.applicable === false
      && honest.canary.detected === null
      && honest.canary.missed.length === 0
      && honest.canary.planted.length === 0;
    say('');
    say(`honest run reports no missed canary: ${ok ? 'yes' : 'NO — regression'}`);
    say(`  applicable=${honest.canary.applicable} detected=${honest.canary.detected} ` +
        `planted=${JSON.stringify(honest.canary.planted)} ` +
        `missed=${JSON.stringify(honest.canary.missed)}`);
    /* The case this field was added for: a leaking column named from the
       dictionary, credited, on a model that never had it. */
    const named = score(['int_rate', 'loan_status'], key, false, features.layer1);
    const r = named.true_positive_reachability;
    const okr = named.true_positives.length === 1 && r.known === true
      && r.by_flag.loan_status === false && r.unreachable_count === 1;
    say('');
    say(`a credited name the model never read is marked unreachable: ` +
        `${okr ? 'yes' : 'NO — regression'}`);
    say(`  credited=${JSON.stringify(named.true_positives)} ` +
        `reachable=${r.reachable_count} unreachable=${r.unreachable_count} ` +
        `precision=${named.precision} (unchanged by this field)`);
  } else {
    say('--- first divergences ---');
    for (const [c, ds] of firstFew) {
      say('');
      say(`${c.name}  canary_present=${JSON.stringify(c.canary_present)}`);
      say(`  flags: ${JSON.stringify(c.flags)}`);
      for (const [p, py, js] of ds) {
        say(`  ${p}`);
        say(`    PY: ${JSON.stringify(py)}`);
        say(`    JS: ${JSON.stringify(js)}`);
      }
    }
  }
} catch (err) {
  say('harness failed: ' + err.message);
  throw err;
}
</script></body></html>
